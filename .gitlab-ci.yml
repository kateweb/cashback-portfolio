stages:
 - deploy
 - cleanup

include:
  - project: gitlab-ci/templates
    ref: master
    file: werf-1.2.gitlab-ci.yml

variables:
  GIT_SUBMODULE_STRATEGY: recursive

.base_deploy:
  stage: deploy
  extends: .werf_converge
  script:
    - build-env -f .env.example -e $CI_ENVIRONMENT_NAME > .env ; cp .env .helm/.env
    - werf converge
      --set gitlab.build=$CI_JOB_ID
      --set gitlab.app=$CI_PROJECT_PATH_SLUG
      --set gitlab.env=$CI_ENVIRONMENT_SLUG
      --set imageCredentials.registry=$CI_REGISTRY
      --set imageCredentials.username=$CI_DEPLOY_USER
      --set imageCredentials.password=$CI_DEPLOY_PASSWORD
      --set ingress.host="$K8S_INGRESS_HOST"

.base_stop:
  stage: cleanup
  extends: .werf_dismiss
  script:
    - touch .env
    - werf dismiss

deploy:stage:
  extends: .base_deploy
  resource_group: stage
  variables:
    K8S_INGRESS_HOST: cashback-service-$CI_ENVIRONMENT_SLUG.sd-app.net
  environment:
    name: stage
    action: start
    url: https://cashback-service-$CI_ENVIRONMENT_SLUG.sd-app.net
    on_stop: "stop:stage"
  only:
    refs:
      - branches

deploy:prod:
  extends: .base_deploy
  resource_group: prod
  variables:
    K8S_INGRESS_HOST: multiback.com.ua
  environment:
    name: prod
    action: start
    url: https://multiback.com.ua
  only:
    refs:
      - tags

stop:stage:
  extends: .base_stop
  resource_group: stage
  environment:
    name: stage
    action: stop
  only:
    refs:
      - branches

stop:prod:
  extends: .base_stop
  resource_group: prod
  environment:
    name: prod
    action: stop
  only:
    refs:
      - tags
    variables:
      - $ENABLE_DESTROY == "YES"

werf:cleanup:
  script:
    - touch .env
    - werf cleanup
